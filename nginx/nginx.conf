events {
    worker_connections 1024;
}

http {
    # Global rate limit zone: 10 requests per second for testing
    # In production, change to 10000r/s
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=10r/s;
    
    upstream rate_limiter {
        server rate-limiter:8080;
    }

    server {
        listen 80;
        server_name _;

        # Apply global rate limit with burst tolerance
        limit_req zone=global_limit burst=5 nodelay;

        # Main location - forward to rate limiter
        location / {
            proxy_pass http://rate_limiter;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Forward cookies
            proxy_cookie_path / /;
            
            # Buffering settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://rate_limiter;
        }
    }
}
